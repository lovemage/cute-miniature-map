<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><title>清邁古城 Chiang Mai Old City</title>
<body style="margin:0;background:#FFFBF2;display:flex;justify-content:center;align-items:center;height:100vh">
<canvas id="c" width="1080" height="1080" style="max-width:100vw;max-height:100vh"></canvas>
<script>
const W=1080,H=1080,FPS=30,DUR=15,N=FPS*DUR,SEG=DUR/4;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
// ---- seeded RNG：保证同一帧每次渲染完全一样 ----
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;
const P={paper:'#FFFBF2',ink:'#2B2B3A',ground:'#F4EDE0',road:'#E9E6EF',water:'#2F5BEA',sky:'#7EC8F2',mint:'#9ED9B4',green:'#3FA66B',
 rape:'#F9C93C',coral:'#F6895C',pink:'#F48FB1',lilac:'#C9A7F0',brick:'#D9744A',gold:'#F2B53A',saffron:'#F28C28',coffee:'#9B6A43',
 red:'#E5484D',lawn:'#C4E8CF',cream:'#FFF1D6',gray:'#8A8797'};
const HOUSE=['#F7C6C7','#A9D8F5','#9ED9B4','#C9A7F0','#FFE08A','#F6A27C','#FFF4E0','#D9A57A'];
const ZH='"Microsoft JhengHei","Noto Sans TC","PingFang TC","Noto Sans CJK TC",sans-serif';
const TH='"Leelawadee UI","Noto Sans Thai",Tahoma,sans-serif';
const pick=(R,a)=>a[R()*a.length|0];
const hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
const riverX=y=>395+16*Math.sin(y/120);

// ---- 古城几何：护城河方环 ----
// 内环路 200–212 · 城墙/草岸 212–228 · 护城河 228–250 · 外环路 252–268
const ROADS=[-110,0,110];                       // 城内主干道（x 与 y 都有）
const CX=[[-200,-116],[-104,-6],[6,104],[116,200]],CY=[[-200,-116],[-104,-9],[9,104],[116,200]];
const TEMPLES=[{id:'singh',x:-200,y:-50,w:80,h:100},{id:'luang',x:-98,y:18,w:88,h:84},{id:'man',x:118,y:-198,w:76,h:56}];
const PLAZA={x:-34,y:-182,w:68,h:44};
const CAFE_PTS=[[60,-60],[160,-62],[-160,-160],[-55,-60],[160,60],[60,160],[-160,160],[-55,160],[312,-82],[-312,150]];
const R=rng(11);
const cafes=CAFE_PTS.map(([x,y])=>({x,y,box:{x:x-15,y:y-15,w:30,h:30},
 umb:[...Array(2+(R()*2|0))].map((_,k)=>({dx:-8+k*8+R()*3,dy:-6+R()*10,c:pick(R,[P.coral,P.rape,P.pink,P.sky,P.lilac,P.mint]),s:R()}))}));
const RESERVED=[...TEMPLES,PLAZA,...cafes.map(c=>c.box)];

// ---- 静态世界：只生成一次 ----
function subdiv(x0,y0,x1,y1,R,out){let y=y0;
 while(y<y1-8){let h=20+R()*16;if(y+h>y1||y1-(y+h)<14)h=y1-y;let x=x0;
  while(x<x1-6){let w=12+R()*18;if(x+w>x1||x1-(x+w)<10)w=x1-x;out.push({x:x+1,y:y+1,w:w-2,h:h-2});x+=w}
  y+=h+4}}
const houses=[],gardens=[],trees=[];
function addLots(x0,y0,x1,y1){const tmp=[];subdiv(x0,y0,x1,y1,R,tmp);
 tmp.forEach(o=>{if(RESERVED.some(r=>hit(o,{x:r.x-2,y:r.y-2,w:r.w+4,h:r.h+4})))return;
  if(R()<.1){gardens.push(o);trees.push({x:o.x+o.w/2,y:o.y+o.h/2,r:5+R()*4,c:pick(R,[P.green,P.green,'#6CC08B',P.pink])});return}
  houses.push({...o,c:pick(R,HOUSE),tex:R()*3|0})})}
// 城内街区
const cityCells=[];CX.forEach(cx=>CY.forEach(cy=>cityCells.push({x:cx[0],y:cy[0],w:cx[1]-cx[0],h:cy[1]-cy[0]})));
cityCells.forEach(c=>addLots(c.x,c.y,c.x+c.w,c.y+c.h));
// 城外街区：内带与城对齐，路口正对城门
const INB=[[-268,-194],[-184,-115],[-105,-60],[-50,-5],[5,50],[60,105],[115,184],[194,268]];
const AX=[];for(let k=0;k<7;k++){AX.push([278+74*k,342+74*k]);AX.push([-342-74*k,-278-74*k])}
const AXIS=[...INB,...AX];
const outBlocks=[];
AXIS.forEach((bx,i)=>AXIS.forEach((by,j)=>{if(i<INB.length&&j<INB.length)return;
 const b={x:bx[0],y:by[0],w:bx[1]-bx[0],h:by[1]-by[0]};
 if(Math.abs(riverX(b.y+b.h/2)-(b.x+b.w/2))<34+b.w/2&&Math.abs(riverX(b.y)-b.x-b.w/2)<34+b.w/2)return; // 整块落在河里就跳过
 if(R()<.12){b.park=true;for(let k=0;k<4;k++)trees.push({x:b.x+8+R()*(b.w-16),y:b.y+8+R()*(b.h-16),r:7+R()*6,c:pick(R,[P.green,'#6CC08B',P.green,P.rape])})}
 outBlocks.push(b)}));
outBlocks.filter(b=>!b.park).forEach(b=>addLots(b.x,b.y,b.x+b.w,b.y+b.h));

// 树：护城河草岸一圈 + 寺院 + 城内零散 + 城外 + 河岸
const GATES=[[0,-1],[1,0],[0,1],[-1,0]];                         // 北 Chang Phuak / 东 Tha Phae / 南 Chiang Mai / 西 Suan Dok
const SAENPUNG=[-136,1];                                           // 西南 Saen Pung 门（南墙）
for(let side=0;side<4;side++)for(let s=-196;s<=196;s+=14+R()*6){
 if(Math.abs(s)>168||ROADS.some(b=>Math.abs(s-b)<20)||(side==2&&Math.abs(s+136)<20))continue;
 const rr=219+R()*4,[x,y]=[[s,-rr],[rr,s],[s,rr],[-rr,s]][side];
 trees.push({x,y,r:6+R()*3.5,c:pick(R,[P.green,P.green,'#6CC08B',P.pink,P.rape])})}
TEMPLES.forEach(tp=>{for(let k=0;k<9;k++){const e=R()*4|0,u=R();
 const [x,y]=[[tp.x+4+u*(tp.w-8),tp.y+5],[tp.x+tp.w-5,tp.y+4+u*(tp.h-8)],[tp.x+4+u*(tp.w-8),tp.y+tp.h-5],[tp.x+5,tp.y+4+u*(tp.h-8)]][e];
 trees.push({x,y,r:5+R()*3,c:pick(R,[P.green,'#6CC08B',P.pink])})}});
for(let k=0;k<120;k++){const x=-720+R()*1440,y=-720+R()*1440;
 if(Math.max(Math.abs(x),Math.abs(y))<274)continue;
 if(Math.abs(x-riverX(y))<40||RESERVED.some(r=>hit({x:x-6,y:y-6,w:12,h:12},r))||Math.abs(x)<10||Math.abs(y)<10)continue;
 if(R()<.5)trees.push({x,y,r:6+R()*6,c:pick(R,[P.green,'#6CC08B',P.green,P.pink,P.rape])})}
for(let y=-720;y<720;y+=26+R()*20){const sd=R()<.5?-1:1;trees.push({x:riverX(y)+sd*(30+R()*4),y,r:7+R()*4,c:pick(R,[P.green,'#6CC08B'])})}
// 城内零散树（避开主路与寺院核心）
for(let k=0;k<70;k++){const x=-196+R()*392,y=-196+R()*392;
 if(ROADS.some(b=>Math.abs(x-b)<9||Math.abs(y-b)<12))continue;
 if(RESERVED.some(r=>hit({x:x-6,y:y-6,w:12,h:12},{x:r.x+8,y:r.y+8,w:r.w-16,h:r.h-16})))continue;
 if(R()<.55)trees.push({x,y,r:5+R()*4,c:pick(R,[P.green,'#6CC08B',P.pink,P.rape])})}
trees.sort((a,b)=>a.y-b.y);

// 步行街摊棚（Ratchadamnoen 週日步行街）
const stalls=[];for(let x=18;x<204;x+=8.5){if(Math.abs(x-110)<9)continue;for(const sy of[-8.5,4])stalls.push({x,y:sy,c:pick(R,[P.coral,P.rape,P.pink,P.sky,P.lilac,P.mint,'#FFFFFF'])})}

// ---- 纹理（网点 / 竖条纹 / 斜线） ----
function tex(g,x,y,w,h,k,a){g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.fillStyle=g.strokeStyle=`rgba(255,255,255,${a||.35})`;
 if(k==0){for(let yy=y,r=0;yy<y+h;yy+=5,r++)for(let xx=x+(r%2)*2.5;xx<x+w;xx+=5)g.fillRect(xx,yy,1.3,1.3)}
 else if(k==1){for(let xx=x+1;xx<x+w;xx+=4)g.fillRect(xx,y,1,h)}
 else{g.lineWidth=1;g.beginPath();for(let d=-h;d<w;d+=5){g.moveTo(x+d,y+h);g.lineTo(x+d+h,y)}g.stroke()}
 g.restore()}
function shadowRect(g,x,y,w,h,o=2.5){g.fillStyle='rgba(43,43,58,.13)';g.fillRect(x+o,y+o,w,h)}
function house(g,o){shadowRect(g,o.x,o.y,o.w,o.h);g.fillStyle=o.c;g.fillRect(o.x,o.y,o.w,o.h);tex(g,o.x,o.y,o.w,o.h,o.tex);
 const hz=o.w>=o.h;g.fillStyle='rgba(255,255,255,.2)';hz?g.fillRect(o.x,o.y,o.w,o.h/2):g.fillRect(o.x,o.y,o.w/2,o.h); // 受光的一面屋顶
 g.strokeStyle='rgba(43,43,58,.15)';g.lineWidth=1;g.beginPath();
 if(hz){g.moveTo(o.x+1,o.y+o.h/2);g.lineTo(o.x+o.w-1,o.y+o.h/2)}else{g.moveTo(o.x+o.w/2,o.y+1);g.lineTo(o.x+o.w/2,o.y+o.h-1)}g.stroke()}
// 兰纳寺院屋顶（俯视：层层内收 + 金色屋脊）
function viharn(g,x,y,w,h,base='#E25B3F'){shadowRect(g,x,y,w,h,3);
 g.fillStyle=base;g.fillRect(x,y,w,h);g.fillStyle=P.coral;g.fillRect(x+3,y+3,w-6,h-6);g.fillStyle='#F9A777';g.fillRect(x+6,y+6,w-12,h-12);
 tex(g,x,y,w,h,1,.18);g.strokeStyle=P.gold;g.lineWidth=2;g.beginPath();
 if(w>=h){g.moveTo(x+2,y+h/2);g.lineTo(x+w-2,y+h/2)}else{g.moveTo(x+w/2,y+2);g.lineTo(x+w/2,y+h-2)}g.stroke();
 g.fillStyle=P.gold;for(const [fx,fy] of w>=h?[[x+1,y+h/2],[x+w-1,y+h/2]]:[[x+w/2,y+1],[x+w/2,y+h-1]]){g.beginPath();g.arc(fx,fy,2.2,0,7);g.fill()}}
function circ(g,x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function chedi(g,x,y,s){g.fillStyle='rgba(43,43,58,.15)';g.fillRect(x-s/2+3,y-s/2+3,s,s);
 g.fillStyle='#FFF4E0';g.fillRect(x-s/2,y-s/2,s,s);circ(g,x+2,y+2,s*.42,'rgba(43,43,58,.12)');
 circ(g,x,y,s*.42,P.gold);circ(g,x,y,s*.28,'#FFD86B');circ(g,x,y,s*.1,'#FFFFFF')}

// ---- 把静态世界画到 2x 离屏画布 ----
const SC=2,WR=740,stat=document.createElement('canvas');stat.width=stat.height=WR*2*SC;
{const g=stat.getContext('2d');g.setTransform(SC,0,0,SC,WR*SC,WR*SC);
 g.fillStyle=P.road;g.fillRect(-WR,-WR,WR*2,WR*2);                                       // 城外道路网底色
 outBlocks.forEach(b=>{g.fillStyle=b.park?P.lawn:P.ground;g.fillRect(b.x,b.y,b.w,b.h);if(b.park)tex(g,b.x,b.y,b.w,b.h,0,.5)});
 // 平河 Mae Ping：草岸 + 河道
 g.lineCap='round';g.beginPath();for(let y=-WR;y<=WR;y+=10){const x=riverX(y);y==-WR?g.moveTo(x,y):g.lineTo(x,y)}
 g.strokeStyle=P.lawn;g.lineWidth=74;g.stroke();g.strokeStyle=P.water;g.lineWidth=44;g.stroke();
 // 护城河方环
 const sq=(r,c)=>{g.fillStyle=c;g.fillRect(-r,-r,2*r,2*r)};
 sq(268,P.road);sq(251,P.lawn);sq(250,P.water);
 g.save();g.beginPath();g.rect(-250,-250,500,500);g.rect(228,-228,-456,456);g.clip('evenodd');tex(g,-250,-250,500,500,0,.28);g.restore();
 sq(228,P.lawn);tex(g,-228,-228,456,456,0,.4);sq(212,P.road);
 cityCells.forEach(c=>{g.fillStyle=P.ground;g.fillRect(c.x,c.y,c.w,c.h)});
 // 城门桥（跨河道路）
 g.fillStyle=P.road;
 for(const b of ROADS){const hw=b==0?7:6;g.fillRect(b-hw,-268,hw*2,56);g.fillRect(b-hw,212,hw*2,56);g.fillRect(-268,b-hw,56,hw*2);g.fillRect(212,b-hw,56,hw*2)}
 g.fillRect(SAENPUNG[0]-6,212,12,56);
 houses.forEach(o=>house(g,o));
 gardens.forEach(o=>{g.fillStyle=P.lawn;g.fillRect(o.x,o.y,o.w,o.h);tex(g,o.x,o.y,o.w,o.h,0,.5)});
 // 咖啡馆露台
 cafes.forEach(c=>{const b=c.box;shadowRect(g,b.x,b.y,b.w,b.h,2);g.fillStyle=P.cream;g.fillRect(b.x,b.y,b.w,b.h);tex(g,b.x,b.y,b.w,b.h,2,.6);
  g.strokeStyle='#E8D2AE';g.lineWidth=1.5;g.strokeRect(b.x+.75,b.y+.75,b.w-1.5,b.h-1.5)});
 // 寺院：草坪 + 白色围墙
 TEMPLES.forEach(tp=>{g.fillStyle=P.lawn;g.fillRect(tp.x,tp.y,tp.w,tp.h);tex(g,tp.x,tp.y,tp.w,tp.h,0,.55);
  g.strokeStyle='#FFFFFF';g.lineWidth=3;g.strokeRect(tp.x+1.5,tp.y+1.5,tp.w-3,tp.h-3)});
 // Wat Phra Singh：主殿朝东、金色佛塔、两座小殿
 viharn(g,-170,-13,44,26);chedi(g,-187,0,22);viharn(g,-160,-40,22,14,'#B9784B');viharn(g,-160,26,22,14);
 // Wat Chedi Luang：残塔（阶梯方台 + 四面那伽阶梯） + 主殿 + 柚木殿 Wat Phan Tao
 {const x=-60,y=66;shadowRect(g,x-25,y-25,50,50,4);
  [['#E2B07E',50],['#D49A68',38],['#C4865A',27]].forEach(([c,s])=>{g.fillStyle=c;g.fillRect(x-s/2,y-s/2,s,s);tex(g,x-s/2,y-s/2,s,s,1,.15)});
  g.fillStyle='#EBC292';g.fillRect(x-4,y-34,8,10);g.fillRect(x-4,y+24,8,10);g.fillRect(x-34,y-4,10,8);g.fillRect(x+24,y-4,10,8);
  circ(g,x,y,10,'#A86A44');circ(g,x-2,y-1,6,'#B9784B');circ(g,x,y,2,'#E2B07E')}
 viharn(g,-30,56,18,22);viharn(g,-92,24,22,13,'#8E5A3A');
 // Wat Chiang Man：大象托塔
 viharn(g,148,-182,36,20);{const x=134,y=-169;chedi(g,x,y,20);g.fillStyle='#BDB6C9';
  for(let k=-1;k<=1;k++){circ(g,x+k*6,y-12,2,'#BDB6C9');circ(g,x+k*6,y+12,2,'#BDB6C9');circ(g,x-12,y+k*6,2,'#BDB6C9');circ(g,x+12,y+k*6,2,'#BDB6C9')}}
 // 三王纪念碑广场
 {const p=PLAZA;g.fillStyle='#F3E3C8';g.fillRect(p.x,p.y,p.w,p.h);tex(g,p.x,p.y,p.w,p.h,1,.5);
  g.fillStyle=P.pink;g.fillRect(p.x+4,p.y+p.h-9,p.w-8,5);
  for(const dx of[-12,0,12]){g.fillStyle='#FFF4E0';g.fillRect(dx-4,p.y+12,8,8);circ(g,dx+1,p.y+17,3,'rgba(43,43,58,.15)');circ(g,dx,p.y+16,3,'#5B4A3A')}}
 // 步行街摊棚
 stalls.forEach(s=>{g.fillStyle='rgba(43,43,58,.15)';g.fillRect(s.x+1.5,s.y+1.5,7,4.5);g.fillStyle=s.c;g.fillRect(s.x,s.y,7,4.5);
  g.fillStyle='rgba(255,255,255,.55)';g.fillRect(s.x+2,s.y,1.2,4.5);g.fillRect(s.x+4.8,s.y,1.2,4.5)});
 // 城墙残段 + 四角堡垒 + 城门
 g.fillStyle=P.brick;
 for(const sgn of[-1,1]){for(const [a,b] of[[-221,-176],[176,221]]){g.fillRect(a,sgn*221-5,b-a,10);g.fillRect(sgn*221-5,a,10,b-a)}}
 const bast=(x,y,s)=>{shadowRect(g,x-s/2,y-s/2,s,s,3);g.fillStyle=P.brick;g.fillRect(x-s/2,y-s/2,s,s);g.fillStyle='#EE9A72';g.fillRect(x-s/2+4,y-s/2+4,s-8,s-8);tex(g,x-s/2,y-s/2,s,s,2,.2)};
 for(const sx of[-1,1])for(const sy of[-1,1])bast(sx*224,sy*224,32);
 const gate=(x,y,hz)=>{const L=46,T=12,w=hz?L:T,h=hz?T:L;shadowRect(g,x-w/2,y-h/2,w,h,3);g.fillStyle=P.brick;g.fillRect(x-w/2,y-h/2,w,h);
  g.fillStyle='#EE9A72';for(let k=0;k<L;k+=6)hz?g.fillRect(x-w/2+k,y-h/2,3,3):g.fillRect(x-w/2,y-h/2+k,3,3);
  g.fillStyle='rgba(43,43,58,.45)';hz?g.fillRect(x-3.5,y-h/2+3,7,h-3):g.fillRect(x-w/2+3,y-3.5,w-3,7)};
 GATES.forEach(([gx,gy])=>gate(gx*220,gy*220,gy!=0));gate(SAENPUNG[0],220,true);
}

// ---- 小动静的数据 ----
const sqPt=(r,s)=>{const L=8*r;s=((s%L)+L)%L;
 if(s<2*r)return[-r+s,-r,0];s-=2*r;if(s<2*r)return[r,-r+s,Math.PI/2];s-=2*r;if(s<2*r)return[r-s,r,Math.PI];s-=2*r;return[-r,r-s,-Math.PI/2]};
const RD=rng(5);
const flows=[...Array(110)].map(()=>({s:RD()*2000,r:231+RD()*16,v:10+RD()*6}));
const rflows=[...Array(46)].map(()=>({v:RD(),o:-15+RD()*30,sp:16+RD()*8}));
const peds=[...Array(26)].map(()=>({x:14+RD()*190,d:RD()<.5?-1:1,v:6+RD()*9,y:-3+RD()*6,c:pick(RD,[P.coral,P.pink,P.sky,P.lilac,P.rape,P.green,P.ink,P.saffron])}));
const songs=[...Array(6)].map((_,k)=>({s:k*350+RD()*80,c:k==2?P.rape:k==4?'#4C8DF0':P.red}));
const cars=[...Array(5)].map((_,k)=>({s:k*420+RD()*90,c:pick(RD,['#FFFFFF','#A9D8F5','#BDB6C9','#FFE08A'])}));
const tuks=[...Array(4)].map((_,k)=>({s:k*412+RD()*60}));
const RIPPLES=[[1.2,-165,-239],[4.0,239,80],[6.8,70,239],[9.6,-239,-150],[12.4,160,-239]];  // 与音频入水声对齐
const FOUNT=[[-60,-239],[239,-60],[60,239],[-239,60]];
const RIVER_BRIDGES=[-170,0,210];
const PH=[
 {zh:'人文',en:'Culture',th:'วัฒนธรรม',c:'#E2643F',x:-60,y:66,
  lzh:'七百年城牆，晨鐘喚醒蘭納古寺',len:'Seven centuries of walls — Lanna temples wake to morning bells',lth:'กำแพงเมืองเจ็ดร้อยปี วัดล้านนาตื่นด้วยเสียงระฆังยามเช้า'},
 {zh:'藝術',en:'Art',th:'ศิลปะ',c:'#8E5CD9',x:120,y:0,
  lzh:'週日步行街，巷弄裡的手作、木雕與壁畫',len:'Sunday walking street — crafts, woodcarving and murals in every lane',lth:'ถนนคนเดินวันอาทิตย์ งานคราฟต์ งานแกะสลัก และภาพวาดทุกตรอกซอย'},
 {zh:'咖啡',en:'Coffee',th:'กาแฟ',c:'#9B6A43',x:60,y:-60,

const grain=document.createElement('canvas');grain.width=W;grain.height=H;{const g=grain.getContext('2d'),Rg=rng(3);
