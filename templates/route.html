<script>
const W=1080,H=1080,FPS=30,DUR=30,N=FPS*DUR;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
// ---- seeded RNG：保证同一帧每次渲染完全一样 ----
function rng(s){return()=>{s|=0;s=s+0x6D2B79F5|0;let t=Math.imul(s^s>>>15,1|s);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ease=t=>t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2,smooth=u=>u<=0?0:u>=1?1:u*u*(3-2*u);
const P={paper:'#FFFBF2',ink:'#2B2B3A',ground:'#F4EDE0',road:'#E9E6EF',walk:'#F3E3C8',water:'#2F5BEA',sky:'#7EC8F2',mint:'#9ED9B4',green:'#3FA66B',
 rape:'#F9C93C',coral:'#F6895C',pink:'#F48FB1',lilac:'#C9A7F0',red:'#E5484D',lawn:'#C4E8CF',cream:'#FFF1D6',gold:'#F2B53A',gray:'#8A8797',bus:'#F4C9B8'};
const HOUSE=['#F7C6C7','#A9D8F5','#9ED9B4','#C9A7F0','#FFE08A','#F6A27C','#FFF4E0','#D9A57A'];

const ZH='"Microsoft JhengHei","Noto Sans TC","PingFang TC","Noto Sans CJK TC",sans-serif',EN='"Segoe UI","Helvetica Neue",Arial,sans-serif';
const pick=(R,a)=>a[R()*a.length|0],hit=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y,mod=(a,b)=>((a%b)+b)%b;
function circ(g,x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
function tex(g,x,y,w,h,k,a){g.save();g.beginPath();g.rect(x,y,w,h);g.clip();g.fillStyle=g.strokeStyle=`rgba(255,255,255,${a||.35})`;
 if(k==0){for(let yy=y,r=0;yy<y+h;yy+=5,r++)for(let xx=x+(r%2)*2.5;xx<x+w;xx+=5)g.fillRect(xx,yy,1.3,1.3)}
 else if(k==1){for(let xx=x+1;xx<x+w;xx+=4)g.fillRect(xx,y,1,h)}
 else{g.lineWidth=1;g.beginPath();for(let d=-h;d<w;d+=5){g.moveTo(x+d,y+h);g.lineTo(x+d+h,y)}g.stroke()}
 g.restore()}
function shadowRect(g,x,y,w,h,ox=2.5,oy=ox){g.fillStyle='rgba(43,43,58,.13)';g.fillRect(x+ox,y+oy,w,h)}

// ================= 世界：台灣大道沿 x 轴（西→东），北在上 =================
const X0=-700,X1=3400,Y0=-640,Y1=640,BH=28;          // 台灣大道半宽：人行道 23–28 · 车道 10–23 · 公车专用道 4–10 · 中央分隔岛 0–4
const XS=[[-660,5],[-500,5],[-340,6],[-120,6],[0,7],[240,6],[410,4],[600,6],[930,9],[1080,5],[1230,6],[1310,6],[1525,4],[1595,4],
 [1780,6],[1940,5],[2100,6],[2225,4],[2275,4],[2420,5],[2580,6],[2750,7],[2900,5],[3060,6],[3250,5]];
const YS=[[-620,5],[-480,6],[-320,5],[-160,6],[0,BH],[160,6],[320,5],[480,6],[620,5]];
const GREEN={x:1529,x2:1591},RIVER={x:2229,x2:2271,c:2250},MRTX=930;
// 地标占地
const LM={theater:{x:30,y:150,w:200,h:180},maple:{x:-330,y:32,w:206,h:122},malls:{x:254,y:34,w:312,h:120},hall:{x:612,y:34,w:308,h:200},
 axis:{x:722,y:234,w:86,h:410},mrt:{x:896,y:-78,w:68,h:46},museum:{x:1318,y:-300,w:204,h:268},green:{x:GREEN.x,y:Y0,w:GREEN.x2-GREEN.x,h:Y1-Y0},
 cmp:{x:1602,y:34,w:170,h:118},shenji:{x:1602,y:236,w:172,h:120},river:{x:RIVER.x,y:Y0,w:RIVER.x2-RIVER.x,h:Y1-Y0},
 market:{x:2760,y:34,w:132,h:196},park:{x:2858,y:-390,w:262,h:310}};
const RES=Object.values(LM);
// 路线：歌劇院前惠來路 → 北上台灣大道 → 东行 → 三民路南转 → 第二市場
const ROUTE=[[0,190],[0,0],[2750,0],[2750,88]];
const SEGL=ROUTE.slice(1).map((p,k)=>Math.hypot(p[0]-ROUTE[k][0],p[1]-ROUTE[k][1])),L=Math.round(SEGL.reduce((a,b)=>a+b,0));
function ptAt(s){s=Math.max(0,Math.min(L,s));for(let k=0;k<SEGL.length;k++){if(s<=SEGL[k]||k==SEGL.length-1){const a=ROUTE[k],b=ROUTE[k+1],u=Math.min(1,s/SEGL[k]);
 return[a[0]+(b[0]-a[0])*u,a[1]+(b[1]-a[1])*u,k]}s-=SEGL[k]}}
// 景点（按路线顺序）：s = 路线上揭示该景点的位置
const STOPS=[
 {zh:'台中國家歌劇院',en:'National Taichung Theater',tz:'伊東豊雄設計的曲牆洞穴',te:"Toyo Ito's curving “sound caves”",x:130,y:200,s:0},
 {zh:'秋紅谷',en:'Maple Garden',tz:'下沉在城市裡的一池湖',te:'A sunken lake in the middle of the city',x:-230,y:70,s:120},
 {zh:'七期百貨商圈',en:'Xitun Shopping District',tz:'百貨林立的新天際線',te:'Department stores and a brand-new skyline',x:410,y:70,s:520},
 {zh:'臺中市政府',en:'Taichung City Hall',tz:'府會園道，綠意一路往南延伸',te:'A civic green axis stretching south',x:765,y:110,s:880},
 {zh:'捷運市政府站',en:'MRT City Hall Station',tz:'綠線列車從頭頂滑過',te:'Green Line trains glide overhead',x:930,y:-56,s:1065},
 {zh:'台灣大道',en:'Taiwan Boulevard',tz:'公車專用道串起東西台中',te:'Bus lanes stitching west and east Taichung',x:1180,y:-26,s:1330},
 {zh:'國立自然科學博物館',en:'National Museum of Natural Science',tz:'恐龍、太空劇場與玻璃溫室',te:'Dinosaurs, a space theater and a glass rainforest',x:1405,y:-205,s:1520},
 {zh:'草悟道',en:'Calligraphy Greenway',tz:'像一筆草書的城市綠帶',te:'A green ribbon written like cursive',x:1560,y:-46,s:1690},
 {zh:'勤美誠品綠園道',en:'Parklane by CMP',tz:'植生牆後的文青日常',te:'Living green walls and bookish afternoons',x:1690,y:72,s:1810},

 {zh:'台中第二市場',en:'Taichung Second Market',tz:'六角樓下的百年早餐',te:'Century-old breakfasts by the hexagon tower',x:2826,y:96,s:2995},
 {zh:'台中公園',en:'Taichung Park',tz:'湖心亭倒映的老台中',te:'The twin lake pavilion of old Taichung',x:2985,y:-190,s:L}];
STOPS.forEach((s,k)=>s.c=ACC[k%ACC.length]);
// 行进速度：经过景点时放慢，起止缓入缓出；预先积分出 时间↔路程 表（纯函数）
const vel=s=>{let b=1;STOPS.forEach(st=>{b-=.55*Math.exp(-(((s-st.s-30)/100)**2))});return Math.max(.3,b)*(.2+.8*smooth(s/240))*(.2+.8*smooth((L-s)/240))};
const TS=[0];for(let s=1;s<=L;s++)TS.push(TS[s-1]+1/vel(s-.5));
const T0=.7,T1=DUR-2.4;
const tOfS=s=>T0+TS[Math.max(0,Math.min(L,Math.round(s)))]/TS[L]*(T1-T0);
function sAt(t){if(t<=T0)return 0;if(t>=T1)return L;const g=(t-T0)/(T1-T0)*TS[L];let lo=0,hi=L;
 while(hi-lo>1){const m=(lo+hi)>>1;TS[m]<g?lo=m:hi=m}return lo+(g-TS[lo])/(TS[hi]-TS[lo])}
STOPS.forEach((s,k)=>s.tr=k==0?-9:tOfS(s.s));
window.META={reveals:STOPS.map(s=>+s.tr.toFixed(3)),dur:DUR};

const xe=[[X0,0],...XS,[X1,0]],ye=[[Y0,0],...YS,[Y1,0]],blocks=[];
for(let i=0;i<xe.length-1;i++)for(let j=0;j<ye.length-1;j++){const x=xe[i][0]+xe[i][1]+2,x2=xe[i+1][0]-xe[i+1][1]-2,y=ye[j][0]+ye[j][1]+2,y2=ye[j+1][0]-ye[j+1][1]-2;

 :{wMin:10,wMax:18,hMin:18,hMax:28,gap:3,ht:[2,5],cols:HOUSE,sign:true};
function subdiv(x0,y0,x1,y1,st,out){let y=y0;
 while(y<y1-st.hMin*.6){let h=st.hMin+R()*(st.hMax-st.hMin);if(y+h>y1||y1-(y+h)<st.hMin*.7)h=y1-y;let x=x0;
  while(x<x1-st.wMin*.6){let w=st.wMin+R()*(st.wMax-st.wMin);if(x+w>x1||x1-(x+w)<st.wMin*.7)w=x1-x;out.push({x:x+st.gap/2,y:y+st.gap/2,w:w-st.gap,h:h-st.gap});x+=w}
  y+=h}}
const bldgs=[],gardens=[],trees=[];
const TC=[P.green,P.green,'#6CC08B','#6CC08B',P.pink,P.rape];
blocks.forEach(b=>{const st=style(b.x+b.w/2),tmp=[];subdiv(b.x,b.y,b.x+b.w,b.y+b.h,st,tmp);
 tmp.forEach(o=>{if(o.w<5||o.h<5||RES.some(r=>hit(o,{x:r.x-3,y:r.y-3,w:r.w+6,h:r.h+6})))return;
  if(R()<.07){gardens.push(o);trees.push({x:o.x+o.w/2,y:o.y+o.h/2,r:Math.min(9,4+Math.min(o.w,o.h)*.3),c:pick(R,TC)});return}
  bldgs.push({...o,c:pick(R,st.cols),tex:R()*3|0,ht:st.ht[0]+R()*(st.ht[1]-st.ht[0]),ac:R()*4|0,sign:st.sign&&R()<.55?pick(R,[P.red,P.rape,P.sky,P.coral,P.green,P.pink]):null,se:R()<.5})})});
// 行道树：台灣大道两侧人行道
const nearStreet=x=>XS.some(([sx,hw])=>Math.abs(x-sx)<hw+7)||(x>GREEN.x-6&&x<GREEN.x2+6)||(x>RIVER.x-6&&x<RIVER.x2+6);
for(let x=X0+10;x<X1;x+=19+R()*5)if(!nearStreet(x))for(const sy of[-25.5,25.5])trees.push({x,y:sy+(R()-.5),r:5+R()*2,c:R()<.85?P.green:'#6CC08B'});
// 地标周边的树
const ring=(cx,cy,rx,ry,n,cols,rr=[5,8])=>{for(let k=0;k<n;k++){const a=k/n*Math.PI*2+R()*.3;trees.push({x:cx+Math.cos(a)*rx*(.92+R()*.1),y:cy+Math.sin(a)*ry*(.92+R()*.1),r:rr[0]+R()*(rr[1]-rr[0]),c:pick(R,cols)})}};
ring(-228,94,92,52,18,[P.red,P.coral,P.red,P.green,'#E86A4A']);                         // 秋紅谷红枫
ring(130,240,92,82,16,[P.green,'#6CC08B',P.pink]);
for(let k=0;k<16;k++)trees.push({x:LM.axis.x+8+(k%2)*(LM.axis.w-16),y:LM.axis.y+12+(k>>1)*50,r:7,c:P.green});
for(let k=0;k<12;k++)trees.push({x:1330+R()*180,y:-130+R()*85,r:6+R()*5,c:pick(R,[P.green,'#6CC08B',P.green])});
for(let y=Y0+10;y<Y1;y+=22+R()*10){if(Math.abs(y)<BH+8||YS.some(([sy,hw])=>Math.abs(y-sy)<hw+6))continue;
 trees.push({x:GREEN.x+6+R()*4,y,r:6+R()*3,c:pick(R,[P.green,'#6CC08B',P.pink])});trees.push({x:GREEN.x2-6-R()*4,y:y+9,r:6+R()*3,c:pick(R,[P.green,'#6CC08B',P.green])});
 trees.push({x:RIVER.x+5,y:y+4,r:6+R()*2,c:'#8FD3A6'});trees.push({x:RIVER.x2-5,y:y+13,r:6+R()*2,c:'#8FD3A6'})}  // 柳川垂柳
ring(2985,-235,118,135,26,[P.green,'#6CC08B',P.green,P.pink],[7,11]);
trees.sort((a,b)=>a.y-b.y);

// ---- 绘制辅助 ----
function bShadow(g,o){g.fillStyle='rgba(43,43,58,.13)';g.fillRect(o.x+o.ht*.45,o.y+o.ht*.6,o.w,o.h)}   // 投影长度 ∝ 楼高
function bTop(g,o){g.fillStyle=o.c;g.fillRect(o.x,o.y,o.w,o.h);tex(g,o.x,o.y,o.w,o.h,o.tex);
 if(o.ht>6){g.strokeStyle='rgba(255,255,255,.6)';g.lineWidth=1.4;g.strokeRect(o.x+3,o.y+3,o.w-6,o.h-6);g.fillStyle='rgba(43,43,58,.16)';for(let k=0;k<o.ac;k++)g.fillRect(o.x+6+k*7,o.y+6,4,4)}
 else{const hz=o.w>=o.h;g.fillStyle='rgba(255,255,255,.2)';hz?g.fillRect(o.x,o.y,o.w,o.h/2):g.fillRect(o.x,o.y,o.w/2,o.h);
  g.strokeStyle='rgba(43,43,58,.15)';g.lineWidth=1;g.beginPath();if(hz){g.moveTo(o.x+1,o.y+o.h/2);g.lineTo(o.x+o.w-1,o.y+o.h/2)}else{g.moveTo(o.x+o.w/2,o.y+1);g.lineTo(o.x+o.w/2,o.y+o.h-1)}g.stroke()}
 if(o.sign){g.fillStyle=o.sign;o.se?g.fillRect(o.x,o.y+o.h-2.6,o.w,2.6):g.fillRect(o.x,o.y,o.w,2.6)}}                 // 老街屋招牌
function blob(g,parts,c){g.fillStyle=c;g.beginPath();parts.forEach(([x,y,r])=>{g.moveTo(x+r,y);g.arc(x,y,r,0,7)});g.fill()}
function hexPath(g,x,y,r){g.beginPath();for(let k=0;k<6;k++){const a=Math.PI/6+k*Math.PI/3;k?g.lineTo(x+r*Math.cos(a),y+r*Math.sin(a)):g.moveTo(x+r*Math.cos(a),y+r*Math.sin(a))}g.closePath()}

const SC=2,stat=document.createElement('canvas');stat.width=(X1-X0)*SC;stat.height=(Y1-Y0)*SC;
{const g=stat.getContext('2d');g.setTransform(SC,0,0,SC,-X0*SC,-Y0*SC);
 g.fillStyle=P.road;g.fillRect(X0,Y0,X1-X0,Y1-Y0);
 blocks.forEach(b=>{g.fillStyle=P.ground;g.fillRect(b.x,b.y,b.w,b.h)});
 // 台灣大道断面
 g.fillStyle=P.walk;g.fillRect(X0,-BH,X1-X0,5);g.fillRect(X0,BH-5,X1-X0,5);tex(g,X0,-BH,X1-X0,5,1,.5);tex(g,X0,BH-5,X1-X0,5,1,.5);
 g.fillStyle=P.bus;g.fillRect(X0,-10,X1-X0,6);g.fillRect(X0,4,X1-X0,6);
 g.fillStyle=P.lawn;g.fillRect(X0,-4,X1-X0,8);tex(g,X0,-4,X1-X0,8,0,.6);
 g.fillStyle='rgba(255,255,255,.9)';for(let x=X0;x<X1;x+=16)for(const y of[-16.5,16.5])g.fillRect(x,y-.6,8,1.2);
 XS.forEach(([sx,hw])=>{g.fillStyle=P.road;g.fillRect(sx-hw,-BH,hw*2,BH*2);g.fillStyle='rgba(255,255,255,.95)';              // 路口斑马线
  for(const ex of[sx-hw-5,sx+hw+1])for(let y=-22;y<22;y+=4)g.fillRect(ex,y,4,2.2)});
 // 一般建筑：先画全部投影再画屋顶
 bldgs.forEach(o=>bShadow(g,o));bldgs.forEach(o=>bTop(g,o));
 gardens.forEach(o=>{g.fillStyle=P.lawn;g.fillRect(o.x,o.y,o.w,o.h);tex(g,o.x,o.y,o.w,o.h,0,.5)});
 const lawn=(r,c=P.lawn)=>{g.fillStyle=c;g.fillRect(r.x,r.y,r.w,r.h);tex(g,r.x,r.y,r.w,r.h,0,.55)};
 // 1 台中國家歌劇院：白色曲面量体 + 屋顶花园 + 洞穴开口
 {lawn(LM.theater);g.fillStyle=P.walk;g.fillRect(30,175,26,36);tex(g,30,175,26,36,1,.5);
  g.fillStyle='rgba(43,43,58,.16)';g.beginPath();g.roundRect(70,186,124,92,28);g.fill();

 // 2 秋紅谷：层层下沉的草阶 + 湖 + 木桥
 {lawn(LM.maple);g.fillStyle='#B2DDBF';g.beginPath();g.roundRect(-318,44,182,98,40);g.fill();g.fillStyle='#A3D6B2';g.beginPath();g.roundRect(-305,56,156,76,32);g.fill();
